version: '1.0'
name: plughub-release
displayName: PlugHub Release

triggers:
  trigger: auto
  push:
    branches:
      precise:
        - main
    tags:
      prefix:
        - V

commitMessage: ''

stages:
  - stage:
      name: release
      displayName: Build and publish release
      strategy: naturally
      trigger: auto
      steps:
        - step: shell@agent
          name: build_publish_release
          displayName: Build and publish Gitee release
          hostGroupID: ${PLUGHUB_WINDOWS_HOST_GROUP_ID}
          script: |
            powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\.workflow\scripts\gitee-release.ps1
