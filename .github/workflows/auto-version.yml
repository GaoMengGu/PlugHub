name: Auto Version Tag

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: "Explicit release tag, for example V1.4.6. Leave empty to increment the latest patch version."
        required: false
        type: string

permissions:
  actions: write
  contents: write

concurrency:
  group: auto-version-tag
  cancel-in-progress: false

jobs:
  create-version-tag:
    name: Create release tag
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        shell: pwsh
        run: |
          git fetch --tags origin
          $explicitVersion = "${{ inputs.version }}".Trim()
          if (![string]::IsNullOrWhiteSpace($explicitVersion)) {
            $tag = $explicitVersion
          }
          else {
            $latest = git tag --list "V[0-9]*.[0-9]*.[0-9]*" --sort=-v:refname | Select-Object -First 1
            if ([string]::IsNullOrWhiteSpace($latest)) {
              $tag = "V1.0.0"
            }
            else {
              $match = [regex]::Match($latest, "^V(?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+)$")
              if (!$match.Success) {
                throw "Latest release tag does not match Vx.y.z: $latest"
              }

              $major = [int]$match.Groups["major"].Value
              $minor = [int]$match.Groups["minor"].Value
              $patch = [int]$match.Groups["patch"].Value + 1
              $tag = "V$major.$minor.$patch"
            }
          }

          if ($tag -notmatch "^V\d+\.\d+\.\d+$") {
            throw "Release tag must match Vx.y.z: $tag"
          }

          $existingTag = git ls-remote --tags origin "refs/tags/$tag"
          if (![string]::IsNullOrWhiteSpace($existingTag)) {
            throw "Release tag already exists: $tag"
          }

          "PLUGHUB_RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Resolved release tag: $tag"

      - name: Create and push release tag
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag $env:PLUGHUB_RELEASE_TAG $env:GITHUB_SHA
          git push origin "refs/tags/$env:PLUGHUB_RELEASE_TAG"

      - name: Dispatch GitHub release workflow
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$env:GITHUB_REPOSITORY/actions/workflows/release.yml/dispatches" -f ref="$env:PLUGHUB_RELEASE_TAG"

      - name: Dispatch Gitee sync workflow
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$env:GITHUB_REPOSITORY/actions/workflows/sync-gitee.yml/dispatches" -f ref="$env:PLUGHUB_RELEASE_TAG"
