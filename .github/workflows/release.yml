name: Release PlugHub

on:
  push:
    tags:
      - "V*"

permissions:
  contents: write
  id-token: write

jobs:
  build-sign-release:
    name: Build, sign, and publish
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Revit 2020 API references
        shell: pwsh
        env:
          REVIT2020_API_ZIP_BASE64: ${{ secrets.REVIT2020_API_ZIP_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:REVIT2020_API_ZIP_BASE64)) {
            throw "Missing secret REVIT2020_API_ZIP_BASE64. It must contain a base64 zip with RevitAPI.dll and RevitAPIUI.dll."
          }

          $apiDir = Join-Path $env:RUNNER_TEMP "revit2020-api"
          $zipPath = Join-Path $env:RUNNER_TEMP "revit2020-api.zip"
          New-Item -ItemType Directory -Force -Path $apiDir | Out-Null
          [IO.File]::WriteAllBytes($zipPath, [Convert]::FromBase64String($env:REVIT2020_API_ZIP_BASE64))
          Expand-Archive -LiteralPath $zipPath -DestinationPath $apiDir -Force

          if (!(Test-Path (Join-Path $apiDir "RevitAPI.dll")) -or !(Test-Path (Join-Path $apiDir "RevitAPIUI.dll"))) {
            throw "The Revit API zip must contain RevitAPI.dll and RevitAPIUI.dll at its root."
          }

          "REVIT_API_DIR=$apiDir" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build Revit 2020 package
        shell: pwsh
        run: .\scripts\build-revit2020.ps1 -RevitApiDir "$env:REVIT_API_DIR"

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign PlugHub DLLs with cosign
        shell: pwsh
        run: |
          $dlls = Get-ChildItem -LiteralPath "dist\Revit2020" -Filter "PlugHub*.dll" -File
          if ($dlls.Count -eq 0) {
            throw "No PlugHub DLLs were found to sign."
          }

          foreach ($dll in $dlls) {
            cosign sign-blob --yes --bundle "$($dll.FullName).sigstore.json" "$($dll.FullName)"
          }

      - name: Package release artifact
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $zipPath = "PlugHub-Revit2020-$tag.zip"
          if (Test-Path $zipPath) {
            Remove-Item -LiteralPath $zipPath -Force
          }

          Compress-Archive -Path "dist\Revit2020\*" -DestinationPath $zipPath -Force
          cosign sign-blob --yes --bundle "$zipPath.sigstore.json" "$zipPath"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: PlugHub ${{ github.ref_name }}
          files: |
            PlugHub-Revit2020-${{ github.ref_name }}.zip
            PlugHub-Revit2020-${{ github.ref_name }}.zip.sigstore.json
            dist/Revit2020/PlugHub*.dll.sigstore.json
