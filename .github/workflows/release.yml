name: Release PlugHub

on:
  push:
    tags:
      - "V*"

permissions:
  contents: write
  id-token: write

jobs:
  build-sign-release:
    name: Build, sign, and publish
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Revit 2020 package
        shell: pwsh
        run: .\scripts\build-revit2020.ps1 -UseRevitApiNuGet -UseRelativeAddinAssembly

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign PlugHub DLLs with cosign
        shell: pwsh
        run: |
          $dlls = Get-ChildItem -LiteralPath "dist\Revit2020" -Filter "PlugHub*.dll" -File
          if ($dlls.Count -eq 0) {
            throw "No PlugHub DLLs were found to sign."
          }

          foreach ($dll in $dlls) {
            cosign sign-blob --yes --bundle "$($dll.FullName).sigstore.json" "$($dll.FullName)"
          }

      - name: Package release artifact
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $zipPath = "PlugHub-Revit2020-$tag.zip"
          $sourceRoot = (Resolve-Path "dist\Revit2020").Path
          $artifactDir = Join-Path $env:RUNNER_TEMP "PlugHub-Revit2020-$tag"
          if (Test-Path $zipPath) {
            Remove-Item -LiteralPath $zipPath -Force
          }

          if (Test-Path $artifactDir) {
            Remove-Item -LiteralPath $artifactDir -Recurse -Force
          }

          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null
          Get-ChildItem -LiteralPath $sourceRoot -Recurse -File |
            Where-Object { $_.Name -notlike "*.sigstore.json" -and $_.Name -notlike "*.pdb" } |
            ForEach-Object {
              $relativePath = $_.FullName.Substring($sourceRoot.Length).TrimStart("\", "/")
              $targetPath = Join-Path $artifactDir $relativePath
              New-Item -ItemType Directory -Force -Path (Split-Path $targetPath -Parent) | Out-Null
              Copy-Item -LiteralPath $_.FullName -Destination $targetPath -Force
            }

          Compress-Archive -Path "$artifactDir\*" -DestinationPath $zipPath -Force
          cosign sign-blob --yes --bundle "$zipPath.sigstore.json" "$zipPath"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: PlugHub ${{ github.ref_name }}
          files: |
            PlugHub-Revit2020-${{ github.ref_name }}.zip
            PlugHub-Revit2020-${{ github.ref_name }}.zip.sigstore.json
            dist/Revit2020/PlugHub*.dll.sigstore.json
