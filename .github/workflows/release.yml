name: Release PlugHub

on:
  push:
    tags:
      - "V*"

permissions:
  contents: write
  id-token: write

jobs:
  build-sign-release:
    name: Build, sign, and publish
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Revit 2020 package
        shell: pwsh
        run: .\scripts\build-revit2020.ps1 -UseRevitApiNuGet

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign PlugHub DLLs with cosign
        shell: pwsh
        run: |
          $dlls = Get-ChildItem -LiteralPath "dist\Revit2020" -Filter "PlugHub*.dll" -File
          if ($dlls.Count -eq 0) {
            throw "No PlugHub DLLs were found to sign."
          }

          foreach ($dll in $dlls) {
            cosign sign-blob --yes --bundle "$($dll.FullName).sigstore.json" "$($dll.FullName)"
          }

      - name: Package release artifact
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $zipPath = "PlugHub-Revit2020-$tag.zip"
          if (Test-Path $zipPath) {
            Remove-Item -LiteralPath $zipPath -Force
          }

          Compress-Archive -Path "dist\Revit2020\*" -DestinationPath $zipPath -Force
          cosign sign-blob --yes --bundle "$zipPath.sigstore.json" "$zipPath"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: PlugHub ${{ github.ref_name }}
          files: |
            PlugHub-Revit2020-${{ github.ref_name }}.zip
            PlugHub-Revit2020-${{ github.ref_name }}.zip.sigstore.json
            dist/Revit2020/PlugHub*.dll.sigstore.json
