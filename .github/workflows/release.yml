name: Release PlugHub

on:
  push:
    tags:
      - "V*"
  workflow_dispatch:
    inputs:
      version:
        description: "Explicit release tag, for example V1.4.6. Leave empty to increment the latest patch version."
        required: false
        type: string

permissions:
  actions: write
  contents: write
  id-token: write

concurrency:
  group: release-plughub-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve-release-tag:
    name: Resolve release tag
    runs-on: ubuntu-latest

    outputs:
      tag: ${{ steps.resolve.outputs.tag }}

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: resolve
        shell: pwsh
        env:
          PLUGHUB_RELEASE_INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          git fetch --tags origin
          $eventName = $env:GITHUB_EVENT_NAME
          $refName = $env:GITHUB_REF_NAME
          $ref = $env:GITHUB_REF
          $explicitVersion = ([string]$env:PLUGHUB_RELEASE_INPUT_VERSION).Trim()
          $createTag = $true

          if ($eventName -eq "push" -and $ref -like "refs/tags/V*") {
            $tag = $refName
            $createTag = $false
          }
          elseif (![string]::IsNullOrWhiteSpace($explicitVersion)) {
            $tag = $explicitVersion
          }
          else {
            $latest = git tag --list "V[0-9]*.[0-9]*.[0-9]*" --sort=-v:refname | Select-Object -First 1
            if ([string]::IsNullOrWhiteSpace($latest)) {
              $tag = "V1.0.0"
            }
            else {
              $match = [regex]::Match($latest, "^V(?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+)$")
              if (!$match.Success) {
                throw "Latest release tag does not match Vx.y.z: $latest"
              }

              $major = [int]$match.Groups["major"].Value
              $minor = [int]$match.Groups["minor"].Value
              $patch = [int]$match.Groups["patch"].Value + 1
              $tag = "V$major.$minor.$patch"
            }
          }

          if ($tag -notmatch "^V\d+\.\d+\.\d+$") {
            throw "Release tag must match Vx.y.z: $tag"
          }

          if ($createTag) {
            $existingTag = git ls-remote --tags origin "refs/tags/$tag"
            if (![string]::IsNullOrWhiteSpace($existingTag)) {
              throw "Release tag already exists: $tag"
            }
          }

          $createTagText = if ($createTag) { "true" } else { "false" }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "create_tag=$createTagText" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Resolved release tag: $tag"

      - name: Create and push release tag
        if: steps.resolve.outputs.create_tag == 'true'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.resolve.outputs.tag }}" $env:GITHUB_SHA
          git push origin "refs/tags/${{ steps.resolve.outputs.tag }}"

      - name: Dispatch Gitee tag sync
        if: steps.resolve.outputs.create_tag == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$env:GITHUB_REPOSITORY/actions/workflows/sync-gitee.yml/dispatches" -f ref="${{ steps.resolve.outputs.tag }}"

  build-sign-release:
    name: Build, sign, and publish
    needs: resolve-release-tag
    runs-on: windows-latest
    env:
      PLUGHUB_RELEASE_TAG: ${{ needs.resolve-release-tag.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-release-tag.outputs.tag }}
          fetch-depth: 0

      - name: Generate release notes
        shell: pwsh
        run: |
          git fetch --tags origin
          $tag = $env:PLUGHUB_RELEASE_TAG
          $notesPath = "PlugHub-ReleaseNotes-$tag.md"
          $previous = git tag --list "V[0-9]*.[0-9]*.[0-9]*" --sort=-v:refname |
            Where-Object { $_ -ne $tag } |
            Select-Object -First 1

          if ([string]::IsNullOrWhiteSpace($previous)) {
            $commits = git log -1 $tag --pretty=format:"- %s"
          }
          else {
            $commits = git log "$previous..$tag" --no-merges --pretty=format:"- %s"
          }

          if ($null -eq $commits -or $commits.Count -eq 0) {
            $commits = @("- 框架构建与发布产物更新。")
          }

          @(
            "## 更新信息",
            "",
            $commits
          ) | Set-Content -LiteralPath $notesPath -Encoding utf8

      - name: Build Revit 2020 package
        shell: pwsh
        run: .\scripts\build-revit2020.ps1 -UseRevitApiNuGet -UseRelativeAddinAssembly

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Package release artifact
        shell: pwsh
        run: |
          $tag = $env:PLUGHUB_RELEASE_TAG
          $zipPath = "PlugHub-Revit2020-$tag.zip"
          $sourceRoot = (Resolve-Path "dist\Revit2020").Path
          $artifactDir = Join-Path $env:RUNNER_TEMP "PlugHub-Revit2020-$tag"
          if (Test-Path $zipPath) {
            Remove-Item -LiteralPath $zipPath -Force
          }

          if (Test-Path $artifactDir) {
            Remove-Item -LiteralPath $artifactDir -Recurse -Force
          }

          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null
          Get-ChildItem -LiteralPath $sourceRoot -Recurse -File |
            Where-Object { $_.Name -notlike "*.sigstore.json" -and $_.Name -notlike "*.pdb" } |
            ForEach-Object {
              $relativePath = $_.FullName.Substring($sourceRoot.Length).TrimStart("\", "/")
              $targetPath = Join-Path $artifactDir $relativePath
              New-Item -ItemType Directory -Force -Path (Split-Path $targetPath -Parent) | Out-Null
              Copy-Item -LiteralPath $_.FullName -Destination $targetPath -Force
            }

          Compress-Archive -Path "$artifactDir\*" -DestinationPath $zipPath -Force
          cosign sign-blob --yes --bundle "$zipPath.sigstore.json" "$zipPath"

      - name: Build PlugHub installer
        shell: pwsh
        run: |
          $tag = $env:PLUGHUB_RELEASE_TAG
          $version = $tag.TrimStart("V")
          $zipPath = "PlugHub-Revit2020-$tag.zip"
          $payloadZip = (Resolve-Path $zipPath).Path
          $installerOutput = Join-Path $env:RUNNER_TEMP "PlugHubInstaller"
          $installerExe = "PlugHub-Setup-$tag.exe"
          if (Test-Path $installerOutput) {
            Remove-Item -LiteralPath $installerOutput -Recurse -Force
          }

          New-Item -ItemType Directory -Force -Path $installerOutput | Out-Null
          dotnet build src\PlugHub.Installer\PlugHub.Installer.csproj -c Release -t:Rebuild /p:InstallerPayloadZip="$payloadZip" /p:OutDir="$installerOutput\" /p:PlugHubVersion="$version" /p:PlugHubReleaseTag="$tag"
          $builtInstaller = Join-Path $installerOutput "PlugHub.Installer.exe"
          if (!(Test-Path $builtInstaller)) {
            throw "Installer build finished but $builtInstaller was not found."
          }

          Copy-Item -LiteralPath $builtInstaller -Destination $installerExe -Force
          cosign sign-blob --yes --bundle "$installerExe.sigstore.json" "$installerExe"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.PLUGHUB_RELEASE_TAG }}
          name: PlugHub ${{ env.PLUGHUB_RELEASE_TAG }}
          body_path: PlugHub-ReleaseNotes-${{ env.PLUGHUB_RELEASE_TAG }}.md
          files: |
            PlugHub-Setup-${{ env.PLUGHUB_RELEASE_TAG }}.exe
            PlugHub-Setup-${{ env.PLUGHUB_RELEASE_TAG }}.exe.sigstore.json
            PlugHub-Revit2020-${{ env.PLUGHUB_RELEASE_TAG }}.zip
            PlugHub-Revit2020-${{ env.PLUGHUB_RELEASE_TAG }}.zip.sigstore.json

      - name: Wait for Gitee tag
        shell: pwsh
        run: |
          $tag = $env:PLUGHUB_RELEASE_TAG
          for ($attempt = 1; $attempt -le 30; $attempt++) {
            $remoteTag = git ls-remote https://gitee.com/GaoMengGu/PlugHub.git "refs/tags/$tag"
            if (![string]::IsNullOrWhiteSpace($remoteTag)) {
              Write-Host "Gitee tag is available: $tag"
              exit 0
            }

            Write-Host "Waiting for Gitee tag sync: $tag ($attempt/30)"
            Start-Sleep -Seconds 10
          }

          throw "Timed out waiting for Gitee tag sync: $tag"

      - name: Publish Gitee release
        shell: pwsh
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          function New-FormBody {
            param([hashtable]$Fields)

            return ($Fields.GetEnumerator() | ForEach-Object {
              "$([Uri]::EscapeDataString($_.Key))=$([Uri]::EscapeDataString([string]$_.Value))"
            }) -join "&"
          }

          if ([string]::IsNullOrWhiteSpace($env:GITEE_TOKEN)) {
            throw "GITEE_TOKEN is required to publish the Gitee release."
          }

          $tag = $env:PLUGHUB_RELEASE_TAG
          $notesPath = "PlugHub-ReleaseNotes-$tag.md"
          $assets = @(
            "PlugHub-Setup-$tag.exe",
            "PlugHub-Setup-$tag.exe.sigstore.json",
            "PlugHub-Revit2020-$tag.zip",
            "PlugHub-Revit2020-$tag.zip.sigstore.json"
          )

          foreach ($asset in $assets) {
            if (!(Test-Path -LiteralPath $asset)) {
              throw "Release asset was not found before Gitee upload: $asset"
            }
          }

          $releaseBaseUri = "https://gitee.com/api/v5/repos/GaoMengGu/PlugHub/releases"
          $releaseBody = Get-Content -LiteralPath $notesPath -Raw
          $escapedToken = [Uri]::EscapeDataString($env:GITEE_TOKEN)
          $escapedTag = [Uri]::EscapeDataString($tag)
          $release = $null

          try {
            $createBody = New-FormBody @{
              access_token = $env:GITEE_TOKEN
              tag_name = $tag
              target_commitish = "main"
              name = "PlugHub $tag"
              body = $releaseBody
              prerelease = "false"
            }
            $release = Invoke-RestMethod -Method Post -Uri $releaseBaseUri -ContentType "application/x-www-form-urlencoded; charset=utf-8" -Body $createBody
          }
          catch {
            $release = Invoke-RestMethod -Method Get -Uri "$releaseBaseUri/tags/$escapedTag?access_token=$escapedToken"
          }

          if ($null -eq $release -or [string]::IsNullOrWhiteSpace([string]$release.id)) {
            throw "Gitee release was not created or resolved for tag $tag."
          }

          foreach ($asset in $assets) {
            $fullPath = (Resolve-Path $asset).Path
            & curl.exe -sS -f -X POST -F "access_token=$($env:GITEE_TOKEN)" -F "file=@$fullPath" "$releaseBaseUri/$($release.id)/attach_files"
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to upload Gitee release attachment: $asset"
            }
          }
